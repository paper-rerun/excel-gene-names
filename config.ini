; Settings for scripts/run_batch.py. Times are local time, the window can cross midnight
[run]
WINDOW_START = 23:30
WINDOW_END = 07:30
WORKERS = 4
; Total download cap in megabytes per second, shared by the workers. 0 = no cap
MAX_MBPS = 0
; The work folder plus the state database never go above this
MAX_DISK_GB = 20
; Stop if the drive gets below this much free space
MIN_FREE_GB = 30
; One article bigger than this is skipped and logged as too_big
MAX_ARTICLE_GB = 2
; One file bigger than this is skipped inside the article
MAX_FILE_MB = 300
CANDIDATES = data/candidates_full_genom.csv
STATE_DB = state/full.sqlite
